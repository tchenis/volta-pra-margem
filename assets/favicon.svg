<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fundo náutico azul-rio com bordas arredondadas -->
  <rect width="64" height="64" rx="14" fill="#0F2E3D"/>
  
  <!-- Contorno de cartão de bolso náutico -->
  <rect x="8" y="10" width="48" height="44" rx="6" stroke="#1F8A7A" stroke-width="2.5" fill="#091d27" stroke-dasharray="2 2"/>
  
  <!-- Linhas d'água sutis na base -->
  <path d="M12 44C16 43 20 45 24 44C28 43 32 45 36 44C40 43 44 45 48 44C50 43.5 52 44 52 44" stroke="#1F8A7A" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Três símbolos em linha: Gota (Água), Raio (Faísca), Bomba (Combustível) -->
  <!-- 1. Gota de Água -->
  <path d="M20 28C20 25.5 22 22 22 22C22 22 24 25.5 24 28C24 29.5 23 31 22 31C21 31 20 29.5 20 28Z" fill="#1F8A7A"/>
  
