  <path d="M33 21L29.5 27.5H32.5L31 33L35.5 26.5H32.5L33 21Z" fill="#F2C14E"/>
  
  <!-- 3. Bomba de Combustível -->
  <path d="M41 23H44.5C45.3 23 46 23.7 46 24.5V31H40V24C40 23.4 40.4 23 41 23Z" stroke="#F57C1F" stroke-width="1.5" fill="none"/>
  <rect x="41.5" y="25" width="3" height="2" fill="#F57C1F"/>
  <path d="M46 25.5H47C47.6 25.5 48 26 48 26.6V30" stroke="#F57C1F" stroke-width="1.2" stroke-linecap="round"/>
</svg>
